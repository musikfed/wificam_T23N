name: WIFICAM static checks
on:
  push:
    branches: [mymarrchWFcam]
  pull_request:
jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax (no target hardware needed)
        run: |
          set -eu
          sh -n scripts/build_thingino_wificam_image.sh
          sh -n scripts/package_rootfs_overlay.sh
          sh -n scripts/wsl_camera_inventory.sh
          sh -n scripts/wsl_restore_camera.sh
          sh -n scripts/camera_diagnostics.sh
          sh -n scripts/camera_preview_fps.sh
          sh -n scripts/camera_smoke_httpd_cgi.sh
          sh -n scripts/rebuild_busybox_cgi_candidate.sh
          sh -n rootfs/usr/bin/wificam-ptz-ctl
          sh -n web/cgi-bin/live.mjpg
          sh -n rootfs/etc/init.d/S90wificam
          sh -n rootfs/usr/bin/wificam-set-web-password
          sh -n web/cgi-bin/api
          sh -n web/cgi-bin/snapshot.jpg
          sh -n web/setup/cgi-bin/claim
      - name: Check local Wi-Fi config generator and no-secret output
        run: |
          python3 -m py_compile scripts/prepare_wifi_overlay.py
          python3 -m unittest discover -s tests -p test_prepare_wifi_overlay.py -v
          python3 -m unittest discover -s tests -p test_cgi_safety_contract.py -v
          python3 -m unittest discover -s tests -p test_t23n_lean_profile.py -v
          python3 -m unittest discover -s tests -p test_assistant_cgi.py -v
      - name: Simulated physical PTZ commands and reverse axes
        run: sh scripts/test_ptz_sim.sh
      - name: PTZ CGI JSON and auth tests
        run: sh scripts/test_ptz_cgi.sh
      - name: JavaScript syntax and browser lazy-stream lifecycle
        run: |
          node --check web/app.js
          node scripts/test_web_lazy_preview.js
