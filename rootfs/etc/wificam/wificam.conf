# WIFICAM T23N service configuration
WIFI_IFACE=wlan0
WPA_CONF=/data/wpa_supplicant.conf
WPA_BACKUP=/data/wpa_supplicant.conf.last-good
RECORDINGS=/mnt/sdcard/recordings

AUTH_CONF=/data/httpd.conf
CSRF_FILE=/var/run/wificam-csrf

# Safe defaults: provision a password over UART before starting the web UI.
ALLOW_UNAUTHENTICATED_WEB=0
ALLOW_REBOOT=0

# Board/sensor-specific commands are intentionally configurable.
# Set these after the exact camera sensor/ISP userspace is validated.
CAMERA_START_CMD=
CAMERA_STOP_CMD=
CAMERA_SNAPSHOT_CMD=
RECORD_START_CMD=
RECORD_STOP_CMD=
