# WIFICAM T23N service configuration

# Camera network
WIFI_IFACE=wlan0
WPA_CONF=/data/wpa_supplicant.conf
WPA_BACKUP=/data/wpa_supplicant.conf.last-good

# Storage: fixed MEDIA partition
MEDIA_MOUNT=/mnt/media
RECORDINGS=/mnt/media/recordings
SNAPSHOTS=/mnt/media/snapshots
EVENTS=/mnt/media/events

# PegineLab boot branding. These are optional and never block boot.
BOOT_SPLASH=1
BOOT_SOUND=1
BOOT_BRANDING_SECONDS=7

# Web
# OpenIPC/Majestic keeps its normal web service on port 80.
# WIFICAM runs separately on 8080 to avoid a port conflict.
WEB_PORT=8080
AUTH_CONF=/data/httpd.conf
CSRF_FILE=/var/run/wificam-csrf

# First SD boot is an unclaimed local-LAN bootstrap. Once a password is set
# through the WIFICAM UI, S90 restarts httpd with Basic Auth and this fallback
# is no longer used because AUTH_CONF exists.
ALLOW_UNAUTHENTICATED_WEB=1
ALLOW_REBOOT=0

# Optional services: disabled by default, enabled only by marker from Web UI.
SERVICE_STATE_DIR=/data/services
VPN_DIR=/data/vpn
SSH_PORT=22
WIREGUARD_CONF=/data/vpn/wg0.conf
AMNEZIAWG_CONF=/data/vpn/awg0.conf

# Optional command overrides for a particular rootfs.
SSH_START_CMD=
SSH_STOP_CMD=
WIREGUARD_START_CMD=
WIREGUARD_STOP_CMD=
AMNEZIAWG_START_CMD=
AMNEZIAWG_STOP_CMD=

# Camera discovery/initialization belongs to the OS and camera drivers at boot.
# These hooks are only for Web UI control if the rootfs exposes explicit service commands.
CAMERA_START_CMD=
CAMERA_STOP_CMD=
CAMERA_SNAPSHOT_CMD=
RECORD_START_CMD=
RECORD_STOP_CMD=
