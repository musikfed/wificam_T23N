# WIFICAM T23N service configuration
#
# This file is shared by both the autonomous SD-root path and the Thingino
# candidate build. Keep defaults portable between the two environments.

# Persistent WIFICAM state.
# Thingino exposes /opt through its writable overlay; autonomous SD-root is
# writable too, so this path works in both cases.
STATE_DIR=/opt/wificam

# Camera network
WIFI_IFACE=wlan0
WPA_CONF=/etc/wpa_supplicant.conf
WPA_BACKUP=/opt/wificam/wpa_supplicant.conf.last-good

# Storage. /mnt/media is the preferred dedicated MEDIA partition on the final
# SD-root image. S90wificam falls back to Thingino's SD mount if MEDIA is absent.
MEDIA_MOUNT=/mnt/media
MEDIA_FALLBACKS="/mnt/mmcblk0p1 /mnt/sdcard /mnt/sda0"
RECORDINGS=/mnt/media/recordings
SNAPSHOTS=/mnt/media/snapshots
EVENTS=/mnt/media/events

# PegineLab boot branding. These are optional and never block boot.
BOOT_SPLASH=1
BOOT_SOUND=1
BOOT_BRANDING_SECONDS=7

# Web
# Thingino/OpenIPC keeps its normal UI on port 80/443.
# PegineLab WIFICAM runs independently on 8090; Thingino camera/API keeps 8080.
WEB_PORT=8090
AUTH_CONF=/opt/wificam/httpd.conf
CSRF_FILE=/var/run/wificam-csrf

# 0.1_test LAN credentials. This is intentionally public/test-only.
# Set AUTO_PROVISION_TEST_WEB_AUTH=0 for the production first-boot claim page.
AUTO_PROVISION_TEST_WEB_AUTH=1
DEFAULT_WEB_USER=admin
DEFAULT_WEB_PASSWORD=Wificam12345
AUTH_PASSWORD_MODE=plain

# First boot is an unclaimed local-LAN bootstrap. After the admin password is
# set, S90wificam restarts BusyBox httpd with Basic Auth.
ALLOW_UNAUTHENTICATED_WEB=1
ALLOW_REBOOT=0

# Optional services: disabled by default, enabled only by marker from Web UI.
SERVICE_STATE_DIR=/opt/wificam/services
VPN_DIR=/opt/wificam/vpn
SSH_PORT=22
# Keep local recovery/ownership access alive. Web UI cannot stop SSH while
# SSH_PROTECT=1; this is intentional for 0.1_test and SD-only bring-up.
SSH_PROTECT=1
WIREGUARD_CONF=/opt/wificam/vpn/wg0.conf
AMNEZIAWG_CONF=/opt/wificam/vpn/awg0.conf

# Optional command overrides for a particular rootfs.
SSH_START_CMD=
SSH_STOP_CMD=
WIREGUARD_START_CMD=
WIREGUARD_STOP_CMD=
AMNEZIAWG_START_CMD=
AMNEZIAWG_STOP_CMD=

# Camera discovery/initialization belongs to the OS and camera drivers at boot.
# wificam-camera-ctl knows the Thingino Prudynt service and also supports these
# explicit overrides for other camera stacks.
CAMERA_START_CMD=
CAMERA_STOP_CMD=
CAMERA_SNAPSHOT_CMD=
RECORD_START_CMD=
RECORD_STOP_CMD=
